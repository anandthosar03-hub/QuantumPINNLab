[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-pinn-lab"
version = "0.2.0"
description = "Physics-informed neural eigenstates, wavepacket dynamics, and qubit Hamiltonian mapping"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = {text = "MIT"}
authors = [{name = "QuantumPINN Lab contributors"}]
keywords = ["quantum mechanics", "PINN", "Schrodinger equation", "quantum computing", "scientific machine learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.5.4,<3",
  "scipy>=1.18.1,<2",
  "matplotlib>=3.11.2,<4",
  "torch>=2.15.0,<3",
  "streamlit>=1.67.0,<2",
]

[project.optional-dependencies]
quantum = ["qiskit>=2.6.2,<3"]
dev = ["pytest>=9.2.0,<10", "ruff>=0.14.0"]

[project.scripts]
quantum-pinn = "quantum_pinn.cli:main"
quantum-pinn-design = "quantum_pinn.design.cli:main"

[tool.setuptools.packages.find]
include = ["quantum_pinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
